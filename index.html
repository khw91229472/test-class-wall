<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼과 사용자 표시 영역 */
    #userArea { margin: 12px 0; display: flex; align-items: center; gap: 10px; font-size: 15px; color: #333; }
    #userArea button { padding: 4px 10px; cursor: pointer; font-size: 14px; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 220px; font-size: 15px; box-sizing: border-box; }
    .memo button.del-btn { float: right; cursor: pointer; }

    /* AI 코멘트 영역 */
    .ai-comment {
      margin-top: 10px;
      padding: 6px 8px;
      background: #e8f5e9;
      border-left: 3px solid #4caf50;
      border-radius: 4px;
      font-size: 13px;
      color: #1b5e20;
      line-height: 1.4;
      word-break: break-word;
    }
    .ai-btn {
      display: block;
      margin-top: 8px;
      padding: 4px 8px;
      font-size: 12px;
      background: #e3f2fd;
      border: 1px solid #90caf9;
      border-radius: 4px;
      cursor: pointer;
      color: #1565c0;
    }
    .ai-btn:hover { background: #bbdefb; }
    .ai-btn:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>


  <!-- 백엔드 2 시간에 여기에 로그인 버튼과 내 이름이 들어옵니다 -->
  <div id="userArea">아직 로그인 기능이 없습니다.</div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
